services:
  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./infra/mariadb-init.sql:/docker-entrypoint-initdb.d/mariadb-init.sql
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
